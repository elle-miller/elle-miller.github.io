<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Into My Arms</title>
    <meta name="description" content="The first fully autonomous bed-to-wheelchair transfer of a medical mannequin by a humanoid robot. Website coming soon.">
    <meta property="og:title" content="Into My Arms">
    <meta property="og:description" content="Structured reinforcement learning for autonomous transport of objects and humans. Website coming soon.">
    <meta property="og:image" content="https://elle-miller.github.io/into_my_arms/static/videos/hero/hero_poster.jpg">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://elle-miller.github.io/into_my_arms/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #1f1a17;
            --paper: #faf6ef;
            --gold: #b8894a;
            --accent: #b4322b;
        }
        body { font-family: 'Inter', sans-serif; background: #0d0b0a; color: var(--ink); margin: 0; }
        .serif { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; }
        .max-page { max-width: 1180px; }
        .eyebrow { letter-spacing: .22em; text-transform: uppercase; font-size: .75rem; font-weight: 600; }

        .hero { position: relative; height: 100vh; min-height: 560px; overflow: hidden; background: #0d0b0a; }
        @media (max-width: 768px) { .hero { height: 100svh; } }
        .hero video, .hero .hero-poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .hero .shade {
            position: absolute; inset: 0;
            background:
                linear-gradient(180deg, rgba(13,11,10,.55) 0%, rgba(13,11,10,0) 28%, rgba(13,11,10,0) 42%, rgba(13,11,10,.88) 100%),
                radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%);
        }
        .grain {
            position: absolute; inset: -50%; pointer-events: none; opacity: .09; mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
            animation: grain 1.2s steps(6) infinite;
        }
        @keyframes grain {
            0% { transform: translate(0,0); } 20% { transform: translate(-3%,2%); } 40% { transform: translate(2%,-3%); }
            60% { transform: translate(-2%,-1%); } 80% { transform: translate(3%,3%); } 100% { transform: translate(0,0); }
        }
        .hero-title { text-shadow: 0 2px 30px rgba(0,0,0,.35); }
        .fade-in { opacity: 0; transform: translateY(14px); animation: fadeIn 1.6s ease-out forwards; }
        .fade-in.d1 { animation-delay: .5s; } .fade-in.d2 { animation-delay: 1.1s; } .fade-in.d3 { animation-delay: 1.7s; }
        @keyframes fadeIn { to { opacity: 1; transform: none; } }

        .soon-pill {
            display: inline-flex; align-items: center; gap: .55rem;
            padding: .55rem 1.05rem; border-radius: 999px;
            background: rgba(255,255,255,.12); color: #fff;
            border: 1px solid rgba(255,255,255,.35);
            backdrop-filter: blur(8px);
            font-weight: 600; font-size: .92rem;
        }
        .soon-pill .dot {
            width: .55rem; height: .55rem; border-radius: 999px;
            background: var(--gold);
            box-shadow: 0 0 0 0 rgba(184,137,74,.55);
            animation: pulse 2.2s ease-out infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(184,137,74,.55); }
            70% { box-shadow: 0 0 0 10px rgba(184,137,74,0); }
            100% { box-shadow: 0 0 0 0 rgba(184,137,74,0); }
        }

        .visitors {
            background: var(--paper);
            padding: 2.5rem 1.25rem 3rem;
        }
        .visitors-card {
            background: #fff;
            border-radius: 1.5rem;
            box-shadow: 0 18px 40px -22px rgba(31,26,23,.35);
            padding: 2rem;
            max-width: 36rem;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @media (prefers-reduced-motion: reduce) {
            .grain, .soon-pill .dot { animation: none; }
            .fade-in { opacity: 1; transform: none; animation: none; }
        }
    </style>
</head>
<body class="antialiased">

<header id="top" class="hero">
    <img class="hero-poster" src="./static/videos/hero/hero_poster.jpg" alt="">
    <video id="hero-video" autoplay muted loop playsinline preload="auto" poster="./static/videos/hero/hero_poster.jpg">
        <source src="./static/videos/hero/hero.mp4" type="video/mp4">
    </video>
    <div class="shade"></div>
    <div class="grain"></div>

    <div class="relative z-10 h-full max-page mx-auto px-5 sm:px-8 flex flex-col justify-end pb-24 sm:pb-28 text-white">
        <h1 class="serif hero-title font-light leading-[0.98] text-6xl sm:text-8xl lg:text-9xl fade-in">
            Into My Arms
        </h1>
        <p class="serif italic font-light mt-4 text-2xl sm:text-3xl text-white/90 max-w-3xl leading-snug fade-in d1">
            Structured reinforcement learning for autonomous transport of objects and humans
        </p>
        <p class="mt-6 text-base sm:text-lg text-white/80 max-w-2xl leading-relaxed fade-in d2">
            The first fully autonomous bed-to-wheelchair transfer of a medical mannequin by a humanoid robot.
        </p>
        <div class="mt-8 fade-in d3">
            <span class="soon-pill"><span class="dot" aria-hidden="true"></span> Website coming soon</span>
        </div>
    </div>
</header>

<section class="visitors" aria-label="Visitor map">
    <div class="visitors-card">
        <script type="text/javascript" id="mapmyvisitors" src="//mapmyvisitors.com/map.js?d=BW-uKoHVbRL2q2hqhlx7yLdPq8Xih8-7v2XE5gRjDRo&cl=ffffff&w=a"></script>
        <p style="text-align: center; font-size: 0.9em; margin-top: 5px; color: #666;">Visitors around the world</p>
    </div>
</section>

<script>
    const video = document.getElementById("hero-video");
    const poster = document.querySelector(".hero-poster");
    if (video) {
        video.addEventListener("loadeddata", () => { if (poster) poster.style.opacity = "0"; });
        video.addEventListener("playing", () => { if (poster) poster.style.display = "none"; });
    }
</script>
</body>
</html>
